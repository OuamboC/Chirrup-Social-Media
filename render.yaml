# Render Blueprint: https://render.com/docs/blueprint-spec
# After deploy, set Vercel CHIRRUP_API_URL to this service URL (e.g. https://chirrup-api.onrender.com)

services:
  - type: web
    name: chirrup-api
    runtime: node
    plan: free
    region: frankfurt
    # npm ci installs deps; sqlite3 prebuilds may target a newer glibc than Render’s
    # runtime — rebuild from source so the native addon links against Render’s libc.
    buildCommand: npm ci && npm rebuild sqlite3 --build-from-source
    startCommand: npm start
    healthCheckPath: /
