# Render Blueprint: https://render.com/docs/blueprint-spec
# After deploy, set Vercel CHIRRUP_API_URL to this service URL (e.g. https://chirrup-api.onrender.com)

services:
  - type: web
    name: chirrup-api
    runtime: node
    plan: free
    region: frankfurt
    # npm ci removes node_modules then installs from lockfile — required when the
    # repo tracks node_modules built on another OS (Windows .node binaries break on Linux).
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
