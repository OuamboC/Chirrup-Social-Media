# Render Blueprint: https://render.com/docs/blueprint-spec
# After deploy, set Vercel CHIRRUP_API_URL to this service URL (e.g. https://chirrup-api.onrender.com)

services:
  - type: web
    name: chirrup-api
    runtime: node
    plan: free
    region: frankfurt
    # Root package.json postinstall rebuilds sqlite3 on Linux (fixes glibc mismatch
    # when the dashboard still uses plain `npm install`).
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    # Ephemeral disk: user data in default db.sqlite is lost on redeploy.
    # To persist SQLite, add a Render Disk, mount e.g. /var/render/data, then set:
    #   envVars: [{ key: SQLITE_PATH, value: /var/render/data/chirrup.sqlite }]
    # (Paid disk feature; free tier cannot retain DB across deploys without Postgres.)
